# Render Blueprint for staging (ADR-0020): the API on a free web service, Valkey on the free Key Value
# and the ML service on a second free web service, all in Singapore next to Neon. Create it once with
# Render → New → Blueprint.
#
# The API deploys through .github/workflows/deploy-staging.yml (after CI passes on main and the
# migrations have run on Neon), not by Render on every push: free services have no pre-deploy step.
# The ML service has no migrations, so Render deploys it itself (see gharbasket-ml below).
# Values marked `sync: false` are entered in the Render dashboard from Infisical `staging`.

services:
  - type: web
    name: gharbasket-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: staging
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Neon's pooled URL (the deploy workflow uses the direct one for migrations).
      - key: DATABASE_URL
        sync: false
      - key: VALKEY_URL
        fromService:
          type: keyvalue
          name: gharbasket-valkey
          property: connectionString
      - key: JWT_SIGNING_KEY
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: JOBS_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # KYC numbers (M8): the pgcrypto key and the duplicate-check pepper, from Infisical.
      - key: KYC_ENCRYPTION_KEY
        sync: false
      - key: KYC_HASH_PEPPER
        sync: false
      # Razorpay test mode (M5 top-ups): from Infisical `staging`. Without them, top-ups answer 503.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # The ML service, the gharbasket-ml web service below (its public https URL); unset: the rule
      # fallbacks answer. The same token goes into both services.
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_TOKEN
        sync: false
      # Timeouts and the circuit breaker of the calls to it (handbook 08 §8.3). The defaults suit
      # the free 0.1 CPU host: a job (the daily T-3 plan generation) waits 30 s, a customer 3 s, and
      # three failed customer calls in a row pause calls to it for a minute. Shown for reference.
      - key: ML_JOB_TIMEOUT_S
        value: "30"
      - key: ML_JOB_BUDGET_S
        value: "20"
      - key: ML_BREAKER_THRESHOLD
        value: "3"
      - key: ML_BREAKER_COOLDOWN_S
        value: "60"
      # Green slots (M10 §3.8, M3 §3.6): on in staging for the MS-D demo; the kill switch is this value.
      - key: GREEN_SLOTS_ENABLED
        value: "true"
      # The pantry twin (M10 §3.3): on in staging since 1 Nov 2026, when its targets held (MAE ≤ 15 %
      # on the mean, 80 % coverage in 75-85 %; #464/#465). Rule priors only: no learned priors are
      # promoted. Keep it off for the pilot until the app says what "Wasted" means (¼ of the box or
      # more left), which the model assumes. The kill switch is this value.
      - key: PANTRY_TWIN_ENABLED
        value: "true"
      # Push (M11): the Firebase service account key file's JSON as one value, from Infisical.
      # Unset: pushes are skipped and the in-app inbox still gets every message.
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      # Private uploads (M0 §3.1) on Cloudflare R2: from Infisical `staging`. Without them,
      # POST /v1/files/presign answers 503 and sweep_uploads fails.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_PRIVATE # gitleaks:allow (a bucket name, not a secret)
        sync: false
      # The Vercel URLs of the PWA and console, comma-separated (empty until they are deployed).
      - key: WEB_ORIGINS
        sync: false
      # Only the Capacitor Android app calls the API cross-origin; browsers use the Vercel rewrite.
      - key: CORS_ALLOW_ORIGINS
        value: https://localhost
      # Where the API's links point: referral links (PUBLIC_WEB_URL, the console's /s/<slug>) and
      # a society page's join button (APP_WEB_URL, the PWA). Unset: the production domains.
      - key: PUBLIC_WEB_URL
        sync: false
      - key: APP_WEB_URL
        sync: false
      # The console's Vercel URL (https://..., no trailing slash). An admin's drift message links
      # to CONSOLE_URL/ai-health so the push opens in a browser; unset: the relative /ai-health.
      - key: CONSOLE_URL
        sync: false

  # The ML service (backend/ml, M10) on a second free web service, without OSRM: routing and slot
  # pricing use their haversine fallback (OSRM_URL is unset). The image is backend/ml/Dockerfile.render;
  # the OSRM image of backend/ml/Dockerfile stays the full one for a local or paid host.
  # Free-tier caveats: 512 MB RAM and 0.1 CPU; the service sleeps after 15 minutes without traffic
  # and wakes in about a minute, and meanwhile the API's short timeouts end in its rule fallbacks
  # (never an error); both free web services share the workspace's 750 instance hours a month, so
  # keeping one awake all month leaves the other asleep part of it.
  - type: web
    name: gharbasket-ml
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/ml/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    # Render deploys on its own for each commit on main that changes something this image is built
    # from (no deploy-hook secret). Not `checksPass`: the informational "JS editor hints" check
    # fails on main, which would hold every ML deploy back.
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/ml/**
        - pyproject.toml
        - uv.lock
        - .dockerignore
    envVars:
      - key: APP_ENV
        value: prod
      # The same value as the API's ML_SERVICE_TOKEN (at least 32 bytes); from Infisical `staging`.
      - key: ML_SERVICE_TOKEN
        sync: false
      # ANTHROPIC_API_KEY is deliberately absent: the assistant is not enabled on staging, so
      # POST /assistant/turn answers 503.
      # The learned models (the basket ranker) come from the R2 registry: with these set and
      # MODELS_DIR unset, the service follows models/<name>/latest.json in gb-staging-mlflow at startup
      # and every MODELS_RELOAD_S (600 s) in the background and caches the versions under /tmp.
      # While R2 is down the synced model keeps serving; without these settings, or until the
      # first sync after a wake (a free instance starts with an empty /tmp), the rule fallback
      # answers. The key pair is its own R2 API token, "Object Read only" on gb-staging-mlflow alone
      # (the service only GETs and HEADs), not the training jobs' read-write keys: stored in
      # Infisical `staging` as ML_S3_ACCESS_KEY / ML_S3_SECRET_KEY and entered here as
      # S3_ACCESS_KEY / S3_SECRET_KEY.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET_MLFLOW # gitleaks:allow (a bucket name, not a secret)
        value: gb-staging-mlflow

  - type: keyvalue
    name: gharbasket-valkey
    plan: free
    region: singapore
    # Empty list: reachable only from Render's private network (the API), never from outside.
    ipAllowList: []
    # Everything stored (rate-limit counters, the sign-out deny-list) expires on its own.
    maxmemoryPolicy: volatile-ttl
