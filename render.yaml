# Render Blueprint for staging (ADR-0020): the API on a free web service, Valkey on the free Key Value
# and the ML service on a second free web service, all in Singapore next to Neon. Create it once with
# Render → New → Blueprint.
#
# The API deploys through .github/workflows/deploy-staging.yml (after CI passes on main and the
# migrations have run on Neon), not by Render on every push: free services have no pre-deploy step.
# The ML service has no migrations, so Render deploys it itself (see gharbasket-ml below).
# Values marked `sync: false` are entered in the Render dashboard from Infisical `staging`.

services:
  - type: web
    name: gharbasket-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: staging
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Neon's pooled URL (the deploy workflow uses the direct one for migrations).
      - key: DATABASE_URL
        sync: false
      - key: VALKEY_URL
        fromService:
          type: keyvalue
          name: gharbasket-valkey
          property: connectionString
      - key: JWT_SIGNING_KEY
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: JOBS_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # KYC numbers (M8): the pgcrypto key and the duplicate-check pepper, from Infisical.
      - key: KYC_ENCRYPTION_KEY
        sync: false
      - key: KYC_HASH_PEPPER
        sync: false
      # Razorpay test mode (M5 top-ups): from Infisical `staging`. Without them, top-ups answer 503.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # The ML service, the gharbasket-ml web service below (its public https URL); unset: the rule
      # fallbacks answer. The same token goes into both services.
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_TOKEN
        sync: false
      # Green slots (M10 §3.8, M3 §3.6): on in staging for the MS-D demo; the kill switch is this value.
      - key: GREEN_SLOTS_ENABLED
        value: "true"
      # The pantry twin (M10 §3.3) stays off until the eval shows its target holds (MAE ≤ 15 %).
      - key: PANTRY_TWIN_ENABLED
        value: "false"
      # Push (M11): the Firebase service account key file's JSON as one value, from Infisical.
      # Unset: pushes are skipped and the in-app inbox still gets every message.
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      # Private uploads (M0 §3.1) on Cloudflare R2: from Infisical `staging`. Without them,
      # POST /v1/files/presign answers 503 and sweep_uploads fails.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_PRIVATE # gitleaks:allow (a bucket name, not a secret)
        sync: false
      # The Vercel URLs of the PWA and console, comma-separated (empty until they are deployed).
      - key: WEB_ORIGINS
        sync: false
      # Only the Capacitor Android app calls the API cross-origin; browsers use the Vercel rewrite.
      - key: CORS_ALLOW_ORIGINS
        value: https://localhost
      # Where the API's links point: referral links (PUBLIC_WEB_URL, the console's /s/<slug>) and
      # a society page's join button (APP_WEB_URL, the PWA). Unset: the production domains.
      - key: PUBLIC_WEB_URL
        sync: false
      - key: APP_WEB_URL
        sync: false

  # The ML service (backend/ml, M10) on a second free web service, without OSRM: routing and slot
  # pricing use their haversine fallback (OSRM_URL is unset). The image is backend/ml/Dockerfile.render;
  # the OSRM image of backend/ml/Dockerfile stays the full one for a local or paid host.
  # Free-tier caveats: 512 MB RAM and 0.1 CPU; the service sleeps after 15 minutes without traffic
  # and wakes in about a minute, and meanwhile the API's short timeouts end in its rule fallbacks
  # (never an error); both free web services share the workspace's 750 instance hours a month, so
  # keeping one awake all month leaves the other asleep part of it.
  - type: web
    name: gharbasket-ml
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/ml/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    # Render deploys on its own once the commit's GitHub checks pass (no deploy-hook secret), and
    # only when something this image is built from changed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/ml/**
        - pyproject.toml
        - uv.lock
        - .dockerignore
    envVars:
      - key: APP_ENV
        value: prod
      # The same value as the API's ML_SERVICE_TOKEN (at least 32 bytes); from Infisical `staging`.
      - key: ML_SERVICE_TOKEN
        sync: false
      # ANTHROPIC_API_KEY is deliberately absent: the assistant is not enabled on staging, so
      # POST /assistant/turn answers 503. MODELS_DIR is unset too: the rule-based rankers answer.

  - type: keyvalue
    name: gharbasket-valkey
    plan: free
    region: singapore
    # Empty list: reachable only from Render's private network (the API), never from outside.
    ipAllowList: []
    # Everything stored (rate-limit counters, the sign-out deny-list) expires on its own.
    maxmemoryPolicy: volatile-ttl
