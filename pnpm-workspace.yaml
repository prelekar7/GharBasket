packages:
  - "frontend/mobile"
  - "frontend/console"
  - "frontend/packages/*"
  - "e2e"

# Dependency install scripts are blocked unless reviewed and allowed here (pnpm supply-chain protection).
allowBuilds:
  lefthook: true
  # Frontend tooling (Vite/Storybook, Next.js image). Their prebuilt binaries arrive as optional
  # dependencies, so the install scripts are reviewed and not needed.
  esbuild: false
  sharp: false
  # Firebase web SDK: @firebase/util writes a Firebase Hosting auto-config and protobufjs checks
  # its CLI version; neither is needed by the app.
  "@firebase/util": false
  protobufjs: false

# Security overrides (GHSA-587h-7wmj-h5pm): msw 3.0.1 resolves vite 8.3.2; 8.3.5 is patched.
# Remove once msw's own range resolves a patched vite.
overrides:
  "msw>vite": 8.3.5

# `pnpm audit` (CI job "Dependency audit", scripts/dependency-audit.sh): high and critical
# advisories fail. An accepted advisory goes under `ignore` as its GHSA ID with a comment: the
# package, why it does not affect us or cannot be upgraded yet, and a review date. The fix is
# always to upgrade; an entry here needs a reviewer's approval in its pull request.
audit:
  level: high
  ignore:
    # @grpc/grpc-js (high): @firebase/firestore pins ~1.9 in every release, so no upgrade exists.
    # It is Firestore's Node transport; the PWA's browser bundle uses WebChannel, not grpc-js.
    # Review by 2027-01-15 or when firebase moves off ~1.9.
    - GHSA-m9gg-hp2v-232j
    # picomatch <= 4.0.7 (high, ReDoS through repeated extglobs): no patched version exists
    # (checked 2026-11-18). It reaches production dependencies only as console > msw > vite
    # (> tinyglobby, fdir): build-time file globbing with patterns written in our config, never
    # a pattern from a request. Review by 2026-12-31 or when a patched picomatch is published.
    - GHSA-fc5q-39xc-vjpf
