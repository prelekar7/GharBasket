<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spike S-1 · Razorpay in Capacitor</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px 16px; background: #fbf7f0; color: #231f1a; }
      label, button { display: block; width: 100%; margin: 8px 0; }
      input { width: 100%; box-sizing: border-box; font: inherit; padding: 10px; }
      button { font: inherit; font-weight: 600; padding: 14px; border: 0; border-radius: 12px; background: #2f5d3a; color: #fff; }
      button.alt { background: #e8e0d2; color: #231f1a; }
      pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #fff; padding: 8px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>S-1 Razorpay Checkout</h1>
    <label>Spike server <input id="server" /></label>
    <label>Amount (₹) <input id="amount" type="number" value="500" /></label>
    <button id="pay-intent">Pay with webview_intent: true</button>
    <button id="pay-plain" class="alt">Pay without webview_intent</button>
    <button id="pay-redirect" class="alt">Pay with redirect: true</button>
    <pre id="log"></pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
