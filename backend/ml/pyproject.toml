[project]
name = "gharbasket-ml"
version = "0.1.0"
description = "GharBasket ML and optimisation service (M10): the CP-SAT meal planner first"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "ortools>=9.15.6755",
    "pydantic-settings>=2.15.0",
    "scipy>=1.14",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gharbasket_ml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["gharbasket_ml"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
