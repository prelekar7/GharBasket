[project]
name = "gharbasket-api"
version = "0.1.0"
description = "GharBasket backend API: FastAPI modular monolith"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "fpdf2>=2.8.9",
    "geoalchemy2>=0.20.0",
    "h3>=4.5.0",
    "httpx2>=2.13.1",
    "indic-transliteration>=2.3.82",
    "phonenumbers>=9.0.40",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "structlog>=26.1.0",
    "uharfbuzz>=0.57.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gharbasket"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["services: needs local Postgres and Valkey (`just up`); skipped when they are not running"]

# `just test` and CI run with coverage; a single file can still be run without it.
[tool.coverage.run]
source = ["gharbasket"]
branch = true
# SQLAlchemy's async layer switches greenlets; without this, code after a database await is missed.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true


# Migrations: `just migrate` (upgrade) and `just migration "<module> <description>"` (autogenerate).
[tool.alembic]
script_location = "%(here)s/migrations"
# YYYYMMDD_HHMM_<module>_<description>.py, as AGENTS.md asks.
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s"
truncate_slug_length = 60
timezone = "UTC"

# New migration files are cleaned up by the same Ruff the repository uses.
[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix --quiet REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format --quiet REVISION_SCRIPT_FILENAME"


# Module boundaries (ADR-0019), checked by `lint-imports` in CI.
[tool.importlinter]
root_package = "gharbasket"

[[tool.importlinter.contracts]]
name = "Modules talk to each other only through api.py"
type = "independence"
modules = [
    "gharbasket.modules.identity",
    "gharbasket.modules.catalog",
    "gharbasket.modules.subscriptions",
    "gharbasket.modules.orders",
    "gharbasket.modules.billing",
    "gharbasket.modules.hub_ops",
    "gharbasket.modules.logistics",
    "gharbasket.modules.partners",
    "gharbasket.modules.community",
    "gharbasket.modules.intel_gateway",
    "gharbasket.modules.notifications",
    "gharbasket.modules.analytics",
    "gharbasket.modules.assistant",
]
ignore_imports = [
    "gharbasket.modules.** -> gharbasket.modules.*.api",
]
# Allowed until the first module actually uses another module's facade.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Platform never depends on modules; modules never depend on the app"
type = "layers"
layers = [
    "gharbasket.tools",
    "gharbasket.main",
    "gharbasket.modules",
    "gharbasket.platform",
]
