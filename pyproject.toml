# uv workspace root. Python services live in their own packages (backend/api now; backend/ml and
# data/simulator later). Shared developer tools sit in the root "dev" group, installed by `uv sync`.
[project]
name = "gharbasket-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["gharbasket-api"]

[tool.uv]
package = false

[tool.uv.sources]
gharbasket-api = { workspace = true }

[tool.uv.workspace]
members = ["backend/api"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.16.10",
    "time-machine>=3.5.1",
]
