# uv workspace root. Python services live in their own packages: backend/api, backend/ml,
# backend/training and data/simulator; e2e/backend is the backend end-to-end suite (a virtual
# member). Shared developer tools sit in the root "dev" group, installed by `uv sync`.
[project]
name = "gharbasket-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["gharbasket-api", "gharbasket-ml", "gharbasket-sim", "gharbasket-training"]

[tool.uv]
package = false

[tool.uv.sources]
gharbasket-api = { workspace = true }
gharbasket-ml = { workspace = true }
gharbasket-sim = { workspace = true }
gharbasket-training = { workspace = true }

[tool.uv.workspace]
members = ["backend/api", "backend/ml", "backend/training", "data/simulator", "e2e/backend"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "pypdf>=6.21.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.10",
    "schemathesis>=4.29.1",
    "time-machine>=3.5.1",
]
