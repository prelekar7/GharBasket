# Shared Ruff config for backend/api, backend/ml, backend/training and data/simulator.
target-version = "py313"
line-length = 100
# First-party packages (for import sorting).
src = ["backend/api/src"]
extend-exclude = ["spikes/**", ".claude/**"]

[lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "ASYNC",    # async pitfalls
  "RUF",      # ruff-specific
  "S",        # bandit (security)
]
ignore = ["S101"]  # assert is fine in tests

[lint.per-file-ignores]
"**/tests/**" = ["S", "B011"]
# Generated by Alembic autogenerate: long operation calls are fine, everything else is checked.
"**/migrations/versions/**" = ["E501"]
# A seeded simulation, not security: `random.Random(seed)` is the point (determinism).
"data/simulator/src/**" = ["S311"]

[format]
quote-style = "double"
docstring-code-format = true
