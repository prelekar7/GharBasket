# Scheduled jobs on staging (ADR-0021): this workflow calls the API's internal job endpoints with
# JOBS_TOKEN for the jobs whose runner is `actions` in infra/jobs/schedule.yaml (daily, weekly and
# the hourly reconcile). Minute-level timing and the evening chain (plans, cut-off, routes) come
# from cron-job.org, which calls the same endpoints; its jobs are the `cron-job.org` entries of
# the same file. That file is the one schedule of every job. Nothing about times lives here except
# the literal cron lines below, which GitHub requires and a test keeps equal to the file.
#
# The `on.schedule` crons are UTC. A run calls every `actions` job whose cron equals the one that
# fired (`github.event.schedule`), so two jobs may share a time. Cron minutes are off the hour:
# GitHub starts :00 schedules late under load. Business rules use `scheduled_for`, which this
# workflow sends, so a late start changes nothing.
# Needs the repository secrets STAGING_API_URL and JOBS_TOKEN; until they exist it skips.
# Any job can be run by hand below with "Run workflow".
name: Scheduled jobs (staging)

on:
  schedule:
    - cron: "3 22 * * *" # 03:33 IST daily: purge_deleted_users, monitor_drift
    - cron: "33 22 * * *" # 04:03 IST daily: cleanup_idempotency_keys
    - cron: "43 22 * * *" # 04:13 IST daily: sweep_uploads
    - cron: "53 22 * * *" # 04:23 IST daily: expire_data_exports
    - cron: "48 22 * * *" # 04:18 IST daily: expire_pending_grants
    - cron: "40 20 * * 0" # 02:10 IST Monday: recompute_unlock_thresholds
    - cron: "40 21 * * *" # 03:10 IST daily: expire_referrals
    - cron: "3 19 * * *" # 00:33 IST daily: expire_kindness_points
    - cron: "3 23 * * *" # 04:33 IST daily: purge_notifications
    - cron: "17 0-18 * * *" # hourly 05:47-23:47 IST: reconcile_payments
    - cron: "3 22 * * 0" # Monday 03:33 IST weekly: compute_vendor_scores (the past IST week)
    - cron: "13 22 * * *" # 03:43 IST daily: purge_gps_pings (pings older than 90 days, M7)
    - cron: "10 21 * * *" # 02:40 IST daily: refresh_analytics_nightly (M12 §3.2)
    - cron: "33 4 * * 1" # Monday 10:03 IST weekly: weekly_payouts (the past IST week, M5 §3.5)
  workflow_dispatch:
    inputs:
      job:
        description: Job name (e.g. outbox_sweep)
        required: true
        type: string
      scheduled_for:
        description: ISO time the run is for (default now)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jobs-staging
  cancel-in-progress: false

jobs:
  run:
    name: Call the job endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
    steps:
      - name: Check out the schedule
        uses: actions/checkout@v7
        with:
          sparse-checkout: infra/jobs
          persist-credentials: false

      - name: Pick the jobs for this trigger
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_FOR: ${{ inputs.scheduled_for }}
        run: |
          if [ -z "$STAGING_API_URL" ] || [ -z "$JOBS_TOKEN" ]; then
            echo "::notice::Staging is not configured yet (STAGING_API_URL, JOBS_TOKEN). Skipping."
            exit 0
          fi
          if [ -z "$SCHEDULE" ]; then
            jobs="$INPUT_JOB"
          else
            # Every `actions` job of infra/jobs/schedule.yaml whose cron is the one that fired.
            # yq (mikefarah, v4) is preinstalled on ubuntu-latest.
            jobs=$(yq '.jobs[] | select(.runner == "actions" and .cron == strenv(SCHEDULE)) | .name' \
              infra/jobs/schedule.yaml | tr '\n' ' ')
            jobs="${jobs% }"
            if [ -z "$jobs" ]; then
              echo "::error::No job in infra/jobs/schedule.yaml has the actions cron '$SCHEDULE'"
              exit 1
            fi
          fi
          case "$jobs" in
            "" | *[!a-z0-9_\ ]*) echo "::error::Not a list of job names: '$jobs'"; exit 1 ;;
          esac
          echo "::notice::Jobs for '${SCHEDULE:-a manual run}': $jobs"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "for=${INPUT_FOR:-$(date -u +%Y-%m-%dT%H:%M:00Z)}" >> "$GITHUB_OUTPUT"

      - name: Run them
        if: steps.pick.outputs.jobs != ''
        env:
          JOBS: ${{ steps.pick.outputs.jobs }}
          FOR: ${{ steps.pick.outputs.for }}
        run: |
          # One failed job must not stop the others that share its time: run all, then fail.
          # --fail-with-body: a failed job answers 500 problem+json with the run id, shown here.
          failed=0
          for JOB in $JOBS; do
            echo "::group::$JOB"
            curl --silent --show-error --fail-with-body --max-time 300 \
              -X POST "$STAGING_API_URL/v1/internal/jobs/$JOB" \
              -H "Authorization: Bearer $JOBS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"scheduled_for\": \"$FOR\"}" || { echo "::error::$JOB failed"; failed=1; }
            echo
            echo "::endgroup::"
          done
          exit "$failed"
