# Training, forecasting and data jobs (ADR-0025): backend/training runs on the Actions runner,
# reads and writes the lake on R2 and hands results to the API's internal endpoints.
# Cron minutes are off the hour (GitHub starts :00 schedules late under load).
# Needs the repository secrets DATA_GOV_IN_API_KEY, S3_ENDPOINT_URL, S3_ACCESS_KEY,
# S3_SECRET_KEY, STAGING_API_URL and JOBS_TOKEN, and DATABASE_URL_RO for export_snapshots;
# until they exist the workflow skips.
name: Training jobs

on:
  schedule:
    - cron: "3 13 * * *" # 18:33 IST daily: collect_mandi (Agmarknet publishes during the day)
    - cron: "33 20 * * *" # 02:03 IST daily: export_snapshots (the lake and the feature snapshots)
  workflow_dispatch:
    inputs:
      job:
        description: Job module (collect_mandi or eval)
        required: true
        type: string
        default: collect_mandi
      args:
        description: Extra arguments (blank = the job's default; collect_mandi --push-index, export_snapshots --push-features)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: training-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Run the job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: auto
      S3_BUCKET_LAKE: gb-lake
      API_URL: ${{ secrets.STAGING_API_URL }}
      JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
      DATABASE_URL_RO: ${{ secrets.DATABASE_URL_RO }}
      # A schedule has no inputs: 18:33 IST runs the collector, 02:03 IST the snapshots.
      JOB: ${{ inputs.job || (github.event.schedule == '33 20 * * *' && 'export_snapshots' || 'collect_mandi') }}
      ARGS: ${{ inputs.args }} # blank: the job's default, set in the run step
    steps:
      - name: Check that the secrets exist
        id: configured
        run: |
          missing=""
          required="DATA_GOV_IN_API_KEY S3_ENDPOINT_URL S3_ACCESS_KEY S3_SECRET_KEY API_URL JOBS_TOKEN"
          # The snapshot export also reads the database with the read-only role.
          if [ "$JOB" = export_snapshots ]; then required="$required DATABASE_URL_RO"; fi
          for name in $required; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Training jobs are not configured yet (missing secrets:$missing). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.configured.outputs.ready == 'true'
        with:
          enable-cache: true

      - name: Run it
        if: steps.configured.outputs.ready == 'true'
        run: |
          # Blank args take the job's own default (eval has none: it adds --push itself).
          if [ -z "$ARGS" ]; then
            case "$JOB" in
              collect_mandi) ARGS="--push-index" ;;
              export_snapshots) ARGS="--push-features" ;;
            esac
          fi
          uv run --directory backend/training python -m "gharbasket_training.jobs.$JOB" $ARGS
