# Training, forecasting and data jobs (ADR-0025): backend/training runs on the Actions runner,
# reads and writes the lake on R2 and hands results to the API's internal endpoints.
# Cron minutes are off the hour (GitHub starts :00 schedules late under load).
# Needs the repository secrets DATA_GOV_IN_API_KEY, S3_ENDPOINT_URL, S3_ACCESS_KEY,
# S3_SECRET_KEY, STAGING_API_URL and JOBS_TOKEN; until they exist the workflow skips.
name: Training jobs

on:
  schedule:
    - cron: "3 13 * * *" # 18:33 IST daily: collect_mandi (Agmarknet publishes during the day)
    - cron: "33 20 * * *" # 02:03 IST daily: export_snapshots (the lake and the feature snapshots)
    - cron: "40 15 * * *" # 21:10 IST daily: forecast (next week's uncommitted demand, after the cut-off)
  workflow_dispatch:
    inputs:
      job:
        description: Job module (e.g. collect_mandi)
        required: true
        type: string
        default: collect_mandi
      args:
        description: Extra arguments
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: training-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Run the job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: auto
      S3_BUCKET_LAKE: gb-lake
      API_URL: ${{ secrets.STAGING_API_URL }}
      JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
      DATABASE_URL_RO: ${{ secrets.DATABASE_URL_RO }}
    steps:
      - name: Check that the secrets exist
        id: configured
        run: |
          missing=""
          for name in DATA_GOV_IN_API_KEY S3_ENDPOINT_URL S3_ACCESS_KEY S3_SECRET_KEY API_URL JOBS_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Training jobs are not configured yet (missing secrets:$missing). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.configured.outputs.ready == 'true'
        with:
          enable-cache: true

      - name: Run it
        if: steps.configured.outputs.ready == 'true'
        env:
          # A schedule has no inputs: 18:33 IST runs the collector, 02:03 IST the snapshots.
          JOB: ${{ inputs.job || (github.event.schedule == '33 20 * * *' && 'export_snapshots' || github.event.schedule == '40 15 * * *' && 'forecast' || 'collect_mandi') }}
          ARGS: ${{ inputs.args || (github.event.schedule == '33 20 * * *' && '--push-features' || github.event.schedule == '40 15 * * *' && '--push' || '--push-index') }}
        run: uv run --directory backend/training python -m "gharbasket_training.jobs.$JOB" $ARGS
