# Training, forecasting and data jobs (ADR-0025): backend/training runs on the Actions runner,
# reads and writes the lake on R2 and hands results to the API's internal endpoints.
# Cron minutes are off the hour (GitHub starts :00 schedules late under load).
# Needs the repository secrets DATA_GOV_IN_API_KEY, S3_ENDPOINT_URL, S3_ACCESS_KEY,
# S3_SECRET_KEY, STAGING_API_URL and JOBS_TOKEN, and DATABASE_URL_RO (the read-only role from
# scripts/neon-ro-role.sh) for the jobs that read the database; until they exist the job skips.
name: Training jobs

on:
  schedule:
    - cron: "33 20 * * *" # 02:03 IST daily: export_snapshots (the lake and the feature snapshots)
    - cron: "40 15 * * *" # 21:10 IST daily: forecast (next week's uncommitted demand, after the cut-off)
    - cron: "33 21 * * 6" # 03:03 IST Sunday: refit_pantry (the twin's cohort priors)
    - cron: "3 22 * * 6" # 03:33 IST Sunday: train_ranker (a candidate; promotion stays manual)
  workflow_dispatch:
    inputs:
      job:
        description: Job module (collect_mandi, export_snapshots, forecast, refit_pantry, train_ranker or eval)
        required: true
        type: string
        default: collect_mandi
      args:
        description: Extra arguments (blank = the job's default; collect_mandi --push-index, export_snapshots --push-features, forecast, refit_pantry and train_ranker --push; promotion is `just promote`)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: training-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Run the job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: auto
      # Staging's R2 buckets (the gb-lake / gb-mlflow defaults are the local SeaweedFS names).
      S3_BUCKET_LAKE: gb-staging-lake
      S3_BUCKET_MLFLOW: gb-staging-mlflow
      API_URL: ${{ secrets.STAGING_API_URL }}
      JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
      DATABASE_URL_RO: ${{ secrets.DATABASE_URL_RO }}
      # A schedule has no inputs: 02:03 IST runs the snapshots, 21:10 IST the forecast, 03:03 IST
      # Sunday the pantry priors' refit, 03:33 IST Sunday the ranker. collect_mandi has no schedule
      # here: api.data.gov.in refuses connections from outside India, so it runs on a VM in
      # Mumbai (scripts/mandi-on-vm.sh; scripts/mandi-on-mac.sh is the fallback); dispatching it
      # here fails with ConnectError.
      JOB: ${{ inputs.job || (github.event.schedule == '33 20 * * *' && 'export_snapshots' || github.event.schedule == '40 15 * * *' && 'forecast' || github.event.schedule == '33 21 * * 6' && 'refit_pantry' || github.event.schedule == '3 22 * * 6' && 'train_ranker' || 'collect_mandi') }}
      ARGS: ${{ inputs.args }} # blank: the job's default, set in the run step
      HC_OPS_URL: ${{ secrets.HC_OPS_URL }}
    steps:
      - name: Check that the secrets exist
        id: configured
        run: |
          missing=""
          required="DATA_GOV_IN_API_KEY S3_ENDPOINT_URL S3_ACCESS_KEY S3_SECRET_KEY API_URL JOBS_TOKEN"
          # The jobs that read the database do so with the read-only role (never DATABASE_URL).
          case "$JOB" in
            export_snapshots | forecast | refit_pantry | train_ranker) required="$required DATABASE_URL_RO" ;;
          esac
          for name in $required; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Training jobs are not configured yet (missing secrets:$missing). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.configured.outputs.ready == 'true'
        with:
          enable-cache: true

      - name: Run it
        if: steps.configured.outputs.ready == 'true'
        run: |
          # Blank args take the job's own default (eval has none: it adds --push itself).
          if [ -z "$ARGS" ]; then
            case "$JOB" in
              collect_mandi) ARGS="--push-index" ;;
              export_snapshots) ARGS="--push-features" ;;
              forecast | refit_pantry | train_ranker) ARGS="--push" ;;
            esac
          fi
          uv run --directory backend/training python -m "gharbasket_training.jobs.$JOB" $ARGS

      - name: Tell the ops alert
        # healthchecks.io `ops` check (ADR-0033); skipped while the secret is unset.
        if: failure() && env.HC_OPS_URL != ''
        env:
          WHAT: ${{ env.JOB }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --silent --show-error --max-time 10 --retry 3 \
            --data-raw "$GITHUB_WORKFLOW: $WHAT failed, $run_url" "$HC_OPS_URL/fail" || true
