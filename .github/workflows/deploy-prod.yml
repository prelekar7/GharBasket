# Deploy a commit to production (ADR-0036, handbook 12 §12.9). Started by hand only; merging to
# main keeps deploying staging alone (deploy-staging.yml).
#
# 1. `verify` (no secrets) refuses a commit that is not on main or whose `Deploy staging` run did
#    not succeed: production only takes what staging already runs.
# 2. `deploy` runs in the GitHub environment `production`, which needs the owner's approval and
#    allows deployments from `main` only. Its secrets are read only after the approval:
#    PROD_DATABASE_URL_DIRECT (direct URL), PROD_DEPLOY_HOOK_URL, PROD_JOBS_TOKEN, optionally
#    PROD_ML_DEPLOY_HOOK_URL; and the variable PROD_API_URL. They carry PROD_ names so that a
#    missing one can never fall back to a staging repository secret. The job then:
#    - refuses an older commit than production runs (fix forward, runbook deploy-rollback.md);
#    - runs the migrations on production's database (expand-then-contract, as on staging);
#    - asks the host to deploy that commit, waits for /v1/health to report it, runs the smoke test.
#
# Host: the hook call below is Render's form (`<hook>&ref=<commit>`). TODO (owner, at pilot time):
# if production's API or ML service is on another host, change "Ask the host to deploy" to that
# host's deploy call; the image must still pass the commit in GIT_COMMIT (backend/api/Dockerfile).
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit on main that staging already runs
        required: true
        type: string
      ml:
        description: Also deploy the ML service at this commit (when backend/ml changed)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One production deploy at a time, never cut off half-way through a migration.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    name: Check the commit is on main and green on staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the commit
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Start this workflow from main (it was started from $GITHUB_REF)."
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$SHA' is not a full 40-character commit id."
            exit 1
          fi
          # base...head with base = the commit: "ahead" or "identical" means it is on main.
          on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status) || {
            echo "::error::GitHub does not know commit $SHA."
            exit 1
          }
          if [ "$on_main" != "ahead" ] && [ "$on_main" != "identical" ]; then
            echo "::error::$SHA is not on main (compare says '$on_main')."
            exit 1
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?head_sha=$SHA&status=success&per_page=1" \
            --jq .total_count)
          if [ "$runs" -lt 1 ]; then
            echo "::error::No successful 'Deploy staging' run for $SHA. Production only takes a commit staging runs."
            exit 1
          fi
          echo "$SHA is on main and staging deployed it."

  deploy:
    name: Migrate, deploy, smoke test production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.PROD_API_URL }}
    env:
      SHA: ${{ inputs.commit }}
      PROD_API_URL: ${{ vars.PROD_API_URL }}
      JOBS_TOKEN: ${{ secrets.PROD_JOBS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check that production is configured
        env:
          PROD_DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL_DIRECT }}
          PROD_DEPLOY_HOOK_URL: ${{ secrets.PROD_DEPLOY_HOOK_URL }}
          PROD_ML_DEPLOY_HOOK_URL: ${{ secrets.PROD_ML_DEPLOY_HOOK_URL }}
          ML: ${{ inputs.ml }}
          # Staging's repository secrets, read only to refuse production values equal to them.
          STAGING_DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          missing=""
          for name in PROD_DATABASE_URL_DIRECT PROD_DEPLOY_HOOK_URL JOBS_TOKEN PROD_API_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ "$ML" = "true" ] && [ -z "$PROD_ML_DEPLOY_HOOK_URL" ]; then missing="$missing PROD_ML_DEPLOY_HOOK_URL"; fi
          if [ -n "$missing" ]; then
            echo "::error::Production is not configured (missing in the 'production' environment:$missing; JOBS_TOKEN is PROD_JOBS_TOKEN)."
            exit 1
          fi
          host() { printf '%s' "$1" | sed -E 's#^[a-z+]+://([^@/]*@)?([^:/?]+).*#\2#'; }
          if [ -n "$STAGING_DATABASE_URL_DIRECT" ] &&
            [ "$(host "$PROD_DATABASE_URL_DIRECT")" = "$(host "$STAGING_DATABASE_URL_DIRECT")" ]; then
            echo "::error::PROD_DATABASE_URL_DIRECT names staging's database host. Refusing."
            exit 1
          fi
          if [ "$PROD_DEPLOY_HOOK_URL" = "$STAGING_DEPLOY_HOOK_URL" ]; then
            echo "::error::PROD_DEPLOY_HOOK_URL is staging's deploy hook. Refusing."
            exit 1
          fi

      - name: Refuse an older commit than production runs
        run: |
          health=$(curl --silent --max-time 60 "$PROD_API_URL/v1/health" || true)
          current=$(printf '%s' "$health" | jq -r '.commit // empty' 2>/dev/null || true)
          environment=$(printf '%s' "$health" | jq -r '.environment // empty' 2>/dev/null || true)
          if [ -z "$current" ]; then
            echo "::warning::$PROD_API_URL/v1/health reports no commit (expected only before the first deploy)."
            exit 0
          fi
          if [ "$environment" != "prod" ]; then
            echo "::error::PROD_API_URL answers as '$environment', not prod. Refusing."
            exit 1
          fi
          # base...head with base = what runs: "ahead" or "identical" means the commit is not older.
          order=$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$SHA" --jq .status)
          if [ "$order" != "ahead" ] && [ "$order" != "identical" ]; then
            echo "::error::Production runs $current; $SHA is '$order' of it. Roll back on the host instead (runbook deploy-rollback.md)."
            exit 1
          fi
          echo "Production runs $current; deploying $SHA ($order)."

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run migrations on production's database
        working-directory: backend/api
        env:
          DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL_DIRECT }}
          # migrations/env.py refuses any non-local database without this flag.
          GB_ALLOW_REMOTE_MIGRATIONS: "1"
        run: |
          uv sync --frozen --no-dev --package gharbasket-api
          uv run --no-sync alembic upgrade head

      - name: Ask the host to deploy this commit
        env:
          PROD_DEPLOY_HOOK_URL: ${{ secrets.PROD_DEPLOY_HOOK_URL }}
          PROD_ML_DEPLOY_HOOK_URL: ${{ secrets.PROD_ML_DEPLOY_HOOK_URL }}
          ML: ${{ inputs.ml }}
        run: |
          curl --fail --silent --show-error --output /dev/null -X POST "${PROD_DEPLOY_HOOK_URL}&ref=${SHA}"
          if [ "$ML" = "true" ]; then
            curl --fail --silent --show-error --output /dev/null -X POST "${PROD_ML_DEPLOY_HOOK_URL}&ref=${SHA}"
            echo "ML service deploy requested; check it with Smoke ML against production's ML URL."
          fi

      - name: Wait until production runs this commit
        run: |
          for _ in $(seq 1 60); do
            commit=$(curl --silent --max-time 60 "$PROD_API_URL/v1/health" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$SHA" ]; then
              echo "Production runs $SHA"
              exit 0
            fi
            echo "Waiting (production reports '${commit:-unknown}')"
            sleep 20
          done
          echo "::error::Production did not report commit $SHA within 20 minutes; check the host's deploy log."
          exit 1

      - name: Smoke test
        run: scripts/smoke-staging.sh "$PROD_API_URL"
