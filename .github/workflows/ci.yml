# Continuous integration for every pull request and every push to main.
# The Python job runs when backend/api exists; the JS hints job when an app has a jsconfig.json;
# the simulated-day job when a pull request touches the backend (and on every push to main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect which parts exist
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      frontend: ${{ steps.check.outputs.frontend }}
      jsconfig: ${{ steps.check.outputs.jsconfig }}
      e2e_day: ${{ steps.e2e_day.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # a pull request's changed files are diffed against its base
      - id: check
        run: |
          echo "api=$([ -f backend/api/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/mobile/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if ls frontend/*/jsconfig.json frontend/packages/*/jsconfig.json >/dev/null 2>&1; then
            echo "jsconfig=true" >> "$GITHUB_OUTPUT"
          else
            echo "jsconfig=false" >> "$GITHUB_OUTPUT"
          fi

      # The simulated day exercises the whole backend, its seed data and the simulator: it runs on every
      # push to main and on pull requests that change any of those, the lockfile, the database image or
      # this workflow. Other pull requests (docs, frontend only) skip it.
      - id: e2e_day
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          if [ "$EVENT" != "pull_request" ]; then
            run=true
          elif git diff --name-only "$BASE_SHA...HEAD" | grep -Eq '^(backend/|e2e/backend/|data/|infra/postgres/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and format (Biome, Ruff, agent docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm from package.json "packageManager", Node from .nvmrc, then runs pnpm install.
      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Biome (JS, JSON, CSS)
        run: pnpm exec biome ci .

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Ruff's version is pinned in pyproject.toml (dev group), the same one lefthook uses.
      - name: Ruff lint
        run: uv run --isolated --frozen --only-group dev ruff check .

      - name: Ruff format check
        run: uv run --isolated --frozen --only-group dev ruff format --check .

      - name: AI-tool instruction files match AGENTS.md
        run: ./scripts/sync-agent-docs.sh --check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to scan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No license needed: the repository belongs to a personal account.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python API (types, boundaries, tests)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.api == 'true'
    env:
      # Database and Valkey tests must run here, not skip.
      GB_REQUIRE_SERVICES: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://gharbasket:gharbasket@localhost:5432/gharbasket_test
      TEST_VALKEY_URL: redis://localhost:6380/15
    steps:
      - uses: actions/checkout@v7

      # A service container cannot pass arguments to valkey-server: the parallel test workers need
      # 128 databases (one each; see backend/api/tests/conftest.py), the default is 16.
      - name: Start Valkey
        run: |
          docker run --detach --name valkey --publish 6380:6379 \
            --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20 \
            valkey/valkey:8.1-alpine valkey-server --databases 128

      # Same image as local development (PostGIS + pgvector on Postgres 18), built from infra/postgres.
      - name: Start Postgres
        run: |
          docker build --quiet --tag gharbasket/postgres:ci infra/postgres
          docker run --detach --name postgres --publish 5432:5432 \
            -e POSTGRES_USER=gharbasket -e POSTGRES_PASSWORD=gharbasket -e POSTGRES_DB=gharbasket \
            gharbasket/postgres:ci

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-packages --frozen

      - name: Pyright
        run: uv run pyright

      - name: Module boundaries (import-linter)
        run: uv run --directory backend/api lint-imports

      # TCP only answers once the init scripts (test database, extensions) have finished.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            docker exec postgres psql -h 127.0.0.1 -U gharbasket -d gharbasket_test -c 'select 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: Tests (coverage gate in backend/api/pyproject.toml)
        run: uv run --directory backend/api pytest --cov -n 4 --dist worksteal --durations=80 --durations-min=3

      - name: ML service tests (coverage gate in backend/ml/pyproject.toml)
        run: uv run --directory backend/ml pytest --cov

      - name: Simulator tests (coverage gate in data/simulator/pyproject.toml)
        run: uv run --directory data/simulator pytest --cov

      - name: Training jobs tests (coverage gate in backend/training/pyproject.toml)
        run: uv run --directory backend/training pytest --cov

      - name: Migrations match the models (run `just migration "..."` if this fails)
        working-directory: backend/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        # The parallel test workers each migrate a database of their own, so migrate this one first.
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: OpenAPI contract is up to date (run `just openapi` if this fails)
        run: |
          uv run python -m gharbasket.tools.export_openapi "$RUNNER_TEMP/openapi.json"
          diff -u backend/api/openapi.json "$RUNNER_TEMP/openapi.json"

  e2e-day:
    name: Backend e2e (the simulated day)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.e2e_day == 'true'
    timeout-minutes: 30
    env:
      # The suite drops and recreates this database (its name must contain "e2e") on the service
      # container only; Valkey db 14 is the harness default. The ML service is not started: the
      # simulator plans with the rule-based fallback, as `just e2e-day` does. SeaweedFS is the
      # private bucket of the journeys that upload files (the partner's KYC); the day's own
      # object-storage jobs stay out of it (NOT_IN_THE_DAY in the suite).
      GB_REQUIRE_SERVICES: "1"
      E2E_S3_URL: http://localhost:8333
      E2E_DATABASE_URL: postgresql+asyncpg://gharbasket:gharbasket@localhost:5432/gharbasket_e2e
      E2E_VALKEY_URL: redis://localhost:6380/14
    steps:
      - uses: actions/checkout@v7

      - name: Start Valkey
        run: |
          docker run --detach --name valkey --publish 6380:6379 \
            --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20 \
            valkey/valkey:8.1-alpine

      # Same image and version as infra/compose (`just up-storage`); the key and secret are the
      # compose defaults that the harness uses, the bucket is the one the API signs for.
      - name: Start SeaweedFS (S3 on :8333)
        run: |
          docker run --detach --name seaweedfs --publish 8333:8333 \
            -e AWS_ACCESS_KEY_ID=gharbasket -e AWS_SECRET_ACCESS_KEY=gharbasket-local-secret \
            chrislusf/seaweedfs:4.48 mini -dir=/data
          for _ in $(seq 1 60); do
            docker exec seaweedfs wget -qO- http://localhost:9333/cluster/status >/dev/null 2>&1 && break
            sleep 2
          done
          for _ in $(seq 1 30); do
            docker exec seaweedfs sh -c 'echo "s3.bucket.create -name gb-private" | weed shell -master=localhost:9333' >/dev/null 2>&1
            docker exec seaweedfs sh -c 'echo "s3.bucket.list" | weed shell -master=localhost:9333' 2>&1 | grep -qw gb-private && exit 0
            sleep 2
          done
          docker logs seaweedfs
          exit 1

      # Same image as local development (PostGIS + pgvector on Postgres 18), built from infra/postgres.
      - name: Start Postgres
        run: |
          docker build --quiet --tag gharbasket/postgres:ci infra/postgres
          docker run --detach --name postgres --publish 5432:5432 \
            -e POSTGRES_USER=gharbasket -e POSTGRES_PASSWORD=gharbasket -e POSTGRES_DB=gharbasket \
            gharbasket/postgres:ci

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Every workspace member: the e2e project alone does not list pytest or the API's dependencies.
      - name: Install
        run: uv sync --all-packages --frozen

      # TCP only answers once the init scripts have finished.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            docker exec postgres psql -h 127.0.0.1 -U gharbasket -d gharbasket_test -c 'select 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: The simulated day (just e2e-day)
        run: uv run --directory e2e/backend pytest

  frontend:
    name: Frontend builds (mobile PWA, console, UI kit)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: API client matches openapi.json (run `just gen-api` if this fails)
        run: |
          pnpm --filter @gharbasket/api-client run generate
          git diff --exit-code -- frontend/packages/api-client

      - name: API client tests
        run: pnpm --filter @gharbasket/api-client test

      - name: Build every frontend package
        run: pnpm --filter "./frontend/**" --workspace-concurrency=1 run build

  js-hints:
    name: JS editor hints (informational, never blocks)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.jsconfig == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Type-check JS through jsconfig.json (checkJs)
        run: |
          status=0
          for cfg in frontend/*/jsconfig.json frontend/packages/*/jsconfig.json; do
            [ -f "$cfg" ] || continue
            echo "::group::$cfg"
            pnpm dlx --package typescript tsc --noEmit -p "$cfg" || status=1
            echo "::endgroup::"
          done
          exit $status
