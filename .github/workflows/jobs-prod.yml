# Scheduled jobs on production (ADR-0036, handbook 12 §12.9): the twin of jobs-staging.yml. It
# calls production's internal job endpoints for the `actions` entries of infra/jobs/schedule.yaml,
# the same entries and crons as staging; the `vm` entries come from production's instance of the
# VM scheduler (`scripts/jobs-on-vm.sh setup prod`, the service `gharbasket-jobs-prod`).
# The `on.schedule` lines are the literal crons GitHub requires; `test_job_schedule.py` keeps them
# equal to the file, as for jobs-staging.yml. See jobs-staging.yml for how a run picks its jobs.
#
# The secrets live in the GitHub environment `production-ops` (deployments from `main` only, no
# reviewers, so the schedule runs unattended) under PROD_ names, never as repository secrets: a
# missing production secret must not fall back to staging's JOBS_TOKEN or URL. Until the variable
# PROD_API_URL and the secret PROD_JOBS_TOKEN exist there, every run skips with a notice. On failure
# it tells production's healthchecks `prod-ops` check (PROD_HC_OPS_URL), if set.
# Any job can be run by hand below with "Run workflow" (from `main`).
name: Scheduled jobs (production)

on:
  schedule:
    - cron: "3 22 * * *" # 03:33 IST daily: purge_deleted_users, monitor_drift, rekey_kyc_documents
    - cron: "33 22 * * *" # 04:03 IST daily: cleanup_idempotency_keys
    - cron: "43 22 * * *" # 04:13 IST daily: sweep_uploads
    - cron: "53 22 * * *" # 04:23 IST daily: expire_data_exports
    - cron: "48 22 * * *" # 04:18 IST daily: expire_pending_grants
    - cron: "40 20 * * 0" # 02:10 IST Monday: recompute_unlock_thresholds
    - cron: "40 21 * * *" # 03:10 IST daily: expire_referrals
    - cron: "3 19 * * *" # 00:33 IST daily: expire_kindness_points
    - cron: "3 23 * * *" # 04:33 IST daily: purge_notifications
    - cron: "0 1-4,7,9,13,15,16 * * *" # 06:30-09:30, 12:30, 14:30, 18:30-21:30 IST: reconcile_payments
    - cron: "3 22 * * 0" # Monday 03:33 IST weekly: compute_vendor_scores (the past IST week)
    - cron: "13 22 * * *" # 03:43 IST daily: purge_gps_pings (pings older than 90 days, M7)
    - cron: "10 21 * * *" # 02:40 IST daily: refresh_analytics_nightly (M12 §3.2)
    - cron: "33 4 * * 1" # Monday 10:03 IST weekly: weekly_payouts (the past IST week, M5 §3.5)
  workflow_dispatch:
    inputs:
      job:
        description: Job name (e.g. outbox_sweep)
        required: true
        type: string
      scheduled_for:
        description: ISO time the run is for (default now)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jobs-prod
  cancel-in-progress: false

jobs:
  run:
    name: Call the job endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ops
    env:
      PROD_API_URL: ${{ vars.PROD_API_URL }}
      JOBS_TOKEN: ${{ secrets.PROD_JOBS_TOKEN }}
      HC_OPS_URL: ${{ secrets.PROD_HC_OPS_URL }}
    steps:
      - name: Check that the secrets exist
        id: configured
        run: |
          if [ -z "$PROD_API_URL" ] || [ -z "$JOBS_TOKEN" ]; then
            echo "::notice::Production's jobs are not configured yet (variable PROD_API_URL, secret PROD_JOBS_TOKEN in 'production-ops'). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the schedule
        if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          sparse-checkout: infra/jobs
          persist-credentials: false

      - name: Pick the jobs for this trigger
        id: pick
        if: steps.configured.outputs.ready == 'true'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_FOR: ${{ inputs.scheduled_for }}
        run: |
          if [ -z "$SCHEDULE" ]; then
            jobs="$INPUT_JOB"
          else
            # Every `actions` job whose cron is the one that fired, compared in the shell (yq's
            # `==` treats `*` as a wildcard; jobs-staging.yml says more).
            jobs=""
            while IFS='|' read -r name cron; do
              if [ "$cron" = "$SCHEDULE" ]; then jobs="$jobs $name"; fi
            done < <(yq '.jobs[] | select(.runner == "actions") | .name + "|" + .cron' infra/jobs/schedule.yaml)
            jobs="${jobs# }"
            if [ -z "$jobs" ]; then
              echo "::error::No job in infra/jobs/schedule.yaml has the actions cron '$SCHEDULE'"
              exit 1
            fi
          fi
          case "$jobs" in
            "" | *[!a-z0-9_\ ]*) echo "::error::Not a list of job names: '$jobs'"; exit 1 ;;
          esac
          echo "::notice::Jobs for '${SCHEDULE:-a manual run}': $jobs"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "for=${INPUT_FOR:-$(date -u +%Y-%m-%dT%H:%M:00Z)}" >> "$GITHUB_OUTPUT"

      - name: Check that the URL is production's
        if: steps.pick.outputs.jobs != ''
        run: |
          # A wrong PROD_API_URL (staging's address) would run production's schedule on staging.
          environment=$(curl --silent --max-time 90 "${PROD_API_URL%/}/v1/health" | jq -r '.environment // empty' || true)
          if [ "$environment" != "prod" ]; then
            echo "::error::PROD_API_URL answers as '${environment:-nothing}', not prod. Refusing."
            exit 1
          fi

      - name: Run them
        if: steps.pick.outputs.jobs != ''
        env:
          JOBS: ${{ steps.pick.outputs.jobs }}
          FOR: ${{ steps.pick.outputs.for }}
        run: |
          # One failed job must not stop the others that share its time: run all, then fail.
          failed=0
          for JOB in $JOBS; do
            echo "::group::$JOB"
            curl --silent --show-error --fail-with-body --max-time 300 \
              -X POST "${PROD_API_URL%/}/v1/internal/jobs/$JOB" \
              -H "Authorization: Bearer $JOBS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"scheduled_for\": \"$FOR\"}" || { echo "::error::$JOB failed"; failed=1; }
            echo
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Tell the ops alert
        # healthchecks.io `prod-ops` check (ADR-0033, ADR-0036); skipped while the secret is unset.
        if: failure() && env.HC_OPS_URL != ''
        env:
          WHAT: ${{ steps.pick.outputs.jobs || 'picking the jobs' }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --silent --show-error --max-time 10 --retry 3 \
            --data-raw "$GITHUB_WORKFLOW: $WHAT failed, $run_url" "$HC_OPS_URL/fail" || true
