# Deploy the ML service to its Hugging Face Space (ADR-0025): after CI passes on main with a change
# under backend/ml, upload that folder to the Space's repository; the Space builds the Dockerfile
# (uvicorn on 7860 plus osrm-routed with the baked MMR network) and restarts.
#
# Needs the repository secrets HF_TOKEN (a write token) and HF_SPACE (e.g. "gharbasket/ml"), and the
# Space's own settings APP_ENV=prod, ML_SERVICE_TOKEN (the same value the API sends) and
# ANTHROPIC_API_KEY (Ghar Saathi, M13). Until the secrets exist the workflow skips with a notice.
name: Deploy ML

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ml
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload backend/ml to the Space
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check that the Space is configured
        id: configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::The ML Space is not configured yet (HF_TOKEN, HF_SPACE). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2

      - name: Did backend/ml change?
        id: changed
        if: steps.configured.outputs.ready == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --quiet HEAD~1 HEAD -- backend/ml; then
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.configured.outputs.ready == 'true' && steps.changed.outputs.yes == 'true'

      - name: Upload the folder to the Space
        if: steps.configured.outputs.ready == 'true' && steps.changed.outputs.yes == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          uvx --from huggingface_hub hf upload "$HF_SPACE" backend/ml . \
            --repo-type space --commit-message "deploy ${SHA::7}" \
            --exclude "tests/*" --exclude ".pytest_cache/*" --exclude "__pycache__/*"
